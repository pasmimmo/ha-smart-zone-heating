<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgState" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="580" rx="18" fill="url(#bgState)"/>
  <rect x="1" y="1" width="1098" height="578" rx="17" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">MACCHINA A STATI — CICLO RISCALDAMENTO, SMALTIMENTO &amp; SICUREZZA</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Come il componente gestisce accensione, spegnimento con controllo Watt (o Timer di fallback) e accensione manuale</text>

  <!-- STATE 1: INATTIVO (IDLE) -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="185" width="240" height="120" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="60" y="185" width="240" height="34" rx="14" fill="#334155"/>
    <text x="180" y="207" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">⏸️ 1. INATTIVO (IDLE)</text>
    <text x="80" y="236" fill="#cbd5e1" font-size="12">• Generatore (Heater): OFF</text>
    <text x="80" y="256" fill="#cbd5e1" font-size="12">• Tutte le Valvole: CHIUSE</text>
    <text x="80" y="276" fill="#94a3b8" font-size="11">• Consumo Stufa: &lt; Soglia W</text>
  </g>

  <!-- STATE 2: RISCALDAMENTO IN CORSO (HEATING) -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="95" width="275" height="135" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="2.5"/>
    <rect x="430" y="95" width="275" height="36" rx="14" fill="#ea580c"/>
    <text x="567" y="118" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">🔥 2. RISCALDAMENTO ATTIVO</text>
    <text x="448" y="150" fill="#fde68a" font-size="12" font-weight="600">• Generatore (Heater): ON</text>
    <text x="448" y="170" fill="#cbd5e1" font-size="12">• Valvole zone in richiesta: APERTE</text>
    <text x="448" y="190" fill="#cbd5e1" font-size="12">• Valvole zone soddisfatte: CHIUSE</text>
    <text x="448" y="210" fill="#94a3b8" font-size="11">Finché almeno 1 zona è &lt; Target + Isteresi</text>
  </g>

  <!-- STATE 3A: SMALTIMENTO WATT (PRIMARY) -->
  <g filter="url(#cardShadow)">
    <rect x="795" y="95" width="265" height="150" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5"/>
    <rect x="795" y="95" width="265" height="36" rx="14" fill="#0284c7"/>
    <text x="927" y="118" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">⚡ 3A. SMALTIMENTO (WATT)</text>
    <text x="812" y="148" fill="#38bdf8" font-size="11" font-weight="700">MODALITÀ PRIMARIA (Presa Smart OK)</text>
    <text x="812" y="168" fill="#cbd5e1" font-size="12">• Generatore (Heater): OFF</text>
    <text x="812" y="187" fill="#34d399" font-size="12" font-weight="600">• Valvola Smaltimento: APERTA</text>
    <text x="812" y="207" fill="#94a3b8" font-size="11">Resta aperta finché la stufa raffredda</text>
    <text x="812" y="224" fill="#38bdf8" font-size="11">Chiude appena Watt &lt; Soglia (es. 10W)</text>
  </g>

  <!-- STATE 3B: SMALTIMENTO TIMER (FALLBACK) -->
  <g filter="url(#cardShadow)">
    <rect x="795" y="330" width="265" height="150" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 3"/>
    <rect x="795" y="330" width="265" height="36" rx="14" fill="#7e22ce"/>
    <text x="927" y="353" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">⏳ 3B. SMALTIMENTO (TIMER)</text>
    <text x="812" y="383" fill="#d8b4fe" font-size="11" font-weight="700">FALLBACK AUTOMATICO (Senza Watt)</text>
    <text x="812" y="403" fill="#cbd5e1" font-size="12">• Generatore (Heater): OFF</text>
    <text x="812" y="422" fill="#34d399" font-size="12" font-weight="600">• Valvola Smaltimento: APERTA</text>
    <text x="812" y="442" fill="#94a3b8" font-size="11">Usato se sensore Watt non configurato</text>
    <text x="812" y="459" fill="#d8b4fe" font-size="11">o diventato unavailable (es. 60 min)</text>
  </g>

  <!-- STATE 4: SICUREZZA ACCENSIONE MANUALE -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="385" width="275" height="135" rx="14" fill="#1e293b" stroke="#eab308" stroke-width="2.5"/>
    <rect x="430" y="385" width="275" height="36" rx="14" fill="#ca8a04"/>
    <text x="567" y="408" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🛡️ 4. SICUREZZA MANUALE (&gt;W)</text>
    <text x="448" y="438" fill="#fef08a" font-size="12" font-weight="600">• Rilevato Consumo &gt;= Soglia (10W)</text>
    <text x="448" y="458" fill="#cbd5e1" font-size="12">  mentre i termostati sono spenti</text>
    <text x="448" y="478" fill="#34d399" font-size="12" font-weight="600">• Apre Valvola Sicurezza Manuale</text>
    <text x="448" y="498" fill="#fbbf24" font-size="11">• Invia notifica Warning sul cellulare</text>
  </g>

  <!-- TRANSITION ARROWS -->
  <!-- 1 -> 2 (Heat Request) -->
  <path d="M 220 185 Q 290 130 422 140" fill="none" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <text x="315" y="122" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">Temp &lt;= Target - Isteresi</text>

  <!-- 2 -> 3A (All satisfied + Power sensor OK) -->
  <path d="M 705 145 L 787 145" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)"/>
  <text x="746" y="122" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Zone OK</text>
  <text x="746" y="136" text-anchor="middle" fill="#38bdf8" font-size="10">(Watt OK)</text>

  <!-- 2 -> 3B (All satisfied + No Power sensor) -->
  <path d="M 705 205 Q 750 280 788 360" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrPurple)"/>
  <text x="720" y="295" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="600">Zone OK (No Watt)</text>

  <!-- 3A -> 3B (Sensor fails mid-cooldown) -->
  <path d="M 927 245 L 927 322" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrPurple)"/>
  <text x="936" y="282" fill="#d8b4fe" font-size="11" font-weight="600">Sensore Watt offline</text>
  <text x="936" y="297" fill="#94a3b8" font-size="10">(Fallback + Warning)</text>

  <!-- 3A -> 1 (Watt < 10W) -->
  <path d="M 795 225 Q 520 295 308 245" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="565" y="280" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Consumo &lt; Soglia (es. &lt; 10W) → Chiude Valvola</text>

  <!-- 3B -> 1 (Timer expired) -->
  <path d="M 795 360 Q 540 340 308 275" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrGreen)"/>
  <text x="565" y="348" text-anchor="middle" fill="#a7f3d0" font-size="11">Fine Timer Fallback (es. 60 min) → Chiude Valvola</text>

  <!-- 1 -> 4 (Manual Ignition > 10W) -->
  <path d="M 190 305 Q 260 440 422 445" fill="none" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrYellow)"/>
  <text x="275" y="422" text-anchor="middle" fill="#facc15" font-size="11" font-weight="600">Consumo &gt;= 10W (Stufa accesa a mano)</text>

  <!-- 4 -> 1 (Manual Ignition ends < 10W) -->
  <path d="M 430 480 Q 220 495 150 313" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="275" y="495" text-anchor="middle" fill="#34d399" font-size="11">Consumo &lt; 10W → Chiude Valvola</text>
</svg>
