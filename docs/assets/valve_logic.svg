<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="420" rx="16" fill="url(#bgFlow)"/>
  <rect x="1" y="1" width="978" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="490" y="38" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">PRIORITÀ APERTURA VALVOLE DI ZONA (PER OGNI CICLO)</text>
  <text x="490" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Una valvola non viene mai chiusa dal suo termostato se è richiesta dallo Smaltimento Calore o dalla Sicurezza &gt; Soglia W</text>

  <!-- Step 1: Check Sensor & Thermostat -->
  <g filter="url(#boxShadow)">
    <rect x="40" y="100" width="210" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="145" y="128" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. Richiesta Termostato?</text>
    <text x="145" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11">Sensore disponibile &amp;</text>
    <text x="145" y="165" text-anchor="middle" fill="#e2e8f0" font-size="11">Temp &lt;= Target - Isteresi</text>
  </g>

  <!-- Step 2: Check Cooldown -->
  <g filter="url(#boxShadow)">
    <rect x="310" y="100" width="210" height="90" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="415" y="128" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="700">2. Smaltimento Attivo?</text>
    <text x="415" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11">Ciclo post-spegnimento &amp;</text>
    <text x="415" y="165" text-anchor="middle" fill="#e2e8f0" font-size="11">Zona == Valvola Smaltimento</text>
  </g>

  <!-- Step 3: Check Manual Safety -->
  <g filter="url(#boxShadow)">
    <rect x="580" y="100" width="210" height="90" rx="12" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="685" y="128" text-anchor="middle" fill="#facc15" font-size="13" font-weight="700">3. Sicurezza &gt; Soglia W?</text>
    <text x="685" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11">Potenza &gt;= Soglia W a freddo &amp;</text>
    <text x="685" y="165" text-anchor="middle" fill="#e2e8f0" font-size="11">Zona == Valvola Manuale</text>
  </g>

  <!-- Result: CLOSE VALVE -->
  <g filter="url(#boxShadow)">
    <rect x="835" y="110" width="115" height="70" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="892" y="142" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">❌ CHIUDI</text>
    <text x="892" y="160" text-anchor="middle" fill="#fecaca" font-size="11">Valvola OFF</text>
  </g>

  <!-- Result: OPEN VALVE BAR -->
  <g filter="url(#boxShadow)">
    <rect x="40" y="285" width="750" height="85" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <text x="415" y="318" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="700">✅ APRI VALVOLA DI ZONA (SWITCH ON)</text>
    <text x="145" y="348" text-anchor="middle" fill="#d1fae5" font-size="12">+ Accendi Generatore di Calore</text>
    <text x="415" y="348" text-anchor="middle" fill="#d1fae5" font-size="12">Generatore OFF • Smaltisce calore residuo</text>
    <text x="685" y="348" text-anchor="middle" fill="#d1fae5" font-size="12">Generatore OFF • Protegge circolatore</text>
  </g>

  <!-- Horizontal No Arrows -->
  <line x1="250" y1="145" x2="302" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="276" y="136" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">NO</text>

  <line x1="520" y1="145" x2="572" y2="145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="546" y="136" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">NO</text>

  <line x1="790" y1="145" x2="827" y2="145" stroke="#f87171" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="808" y="136" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">NO</text>

  <!-- Vertical Yes Arrows -->
  <line x1="145" y1="190" x2="145" y2="277" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="162" y="238" fill="#34d399" font-size="12" font-weight="700">SÌ</text>

  <line x1="415" y1="190" x2="415" y2="277" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="432" y="238" fill="#34d399" font-size="12" font-weight="700">SÌ</text>

  <line x1="685" y1="190" x2="685" y2="277" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="702" y="238" fill="#34d399" font-size="12" font-weight="700">SÌ</text>
</svg>
