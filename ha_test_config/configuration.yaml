default_config:

# Simulazione hardware fisico di casa (3 switch + 3 slider per variare temperature e Watt)
template:
  - switch:
      - name: "Stufa (Contatto Pulito)"
        unique_id: hw_switch_stufa_pellet
        icon: mdi:fire
        turn_on: []
        turn_off: []
      - name: "Valvola Zona Piano 1"
        unique_id: hw_switch_valvola_piano_1
        icon: mdi:pipe-valve
        turn_on: []
        turn_off: []
      - name: "Valvola Zona Piano 2"
        unique_id: hw_switch_valvola_piano_2
        icon: mdi:pipe-valve
        turn_on: []
        turn_off: []

input_number:
  temperatura_piano_1:
    name: "Sensore Temp Piano 1"
    min: 10
    max: 30
    step: 0.5
    initial: 18.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer
  temperatura_piano_2:
    name: "Sensore Temp Piano 2"
    min: 10
    max: 30
    step: 0.5
    initial: 19.0
    unit_of_measurement: "°C"
    icon: mdi:thermometer
  potenza_stufa_watt:
    name: "Sensore Consumo Stufa (W)"
    min: 0
    max: 400
    step: 5
    initial: 0
    unit_of_measurement: "W"
    icon: mdi:flash

